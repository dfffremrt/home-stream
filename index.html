<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 Мой портал</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0f1115; color: #e6e8eb; min-height: 100vh;
    padding: 40px 20px;
  }
  header {
    max-width: 1200px; margin: 0 auto 40px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 16px;
  }
  h1 { font-size: 28px; }
  h1 span { color: #4a7aff; }
  #clock { font-size: 18px; color: #8b93a1; font-variant-numeric: tabular-nums; }
  .grid {
    max-width: 1200px; margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .tile {
    background: #1a1d24; border: 1px solid #2a2e38;
    border-radius: 16px; padding: 24px;
    text-decoration: none; color: inherit;
    display: flex; flex-direction: column; gap: 10px;
    transition: transform .15s, border-color .15s, background .15s;
    min-height: 150px; position: relative;
  }
  .tile:hover {
    transform: translateY(-4px);
    background: #22262f;
    border-color: var(--tile-color, #4a7aff);
  }
  .tile .icon { font-size: 42px; }
  .tile .name { font-size: 18px; font-weight: 600; }
  .tile .desc { font-size: 13px; color: #8b93a1; }
  .tile .arrow {
    position: absolute; top: 20px; right: 20px;
    color: #4a7aff; font-size: 20px;
    opacity: 0; transition: opacity .15s, transform .15s;
  }
  .tile:hover .arrow { opacity: 1; transform: translateX(4px); }
  footer {
    max-width: 1200px; margin: 60px auto 0;
    text-align: center; color: #4a5262; font-size: 13px;
  }
  footer a { color: #4a7aff; text-decoration: none; }
</style>
</head>
<body>

<header>
  <h1>🏠 Мой <span>портал</span></h1>
  <div id="clock">--:--:--</div>
</header>

<main class="grid" id="grid">
  <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #8b93a1;">
    Загрузка...
  </div>
</main>

<footer>
  Собрано вручную · <a href="/admin">⚙️ Админка</a>
</footer>

<script>
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleDateString('ru-RU') + ' · ' + now.toLocaleTimeString('ru-RU');
  }
  updateClock();
  setInterval(updateClock, 1000);

  fetch('/api/portal')
    .then(r => r.json())
    .then(data => {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      data.tiles.forEach(t => {
        const a = document.createElement('a');
        a.className = 'tile';
        a.href = t.url;
        a.style.setProperty('--tile-color', t.color || '#4a7aff');
        a.innerHTML = `
          <div class="icon">${t.icon || '📄'}</div>
          <div class="name">${t.name}</div>
          <div class="desc">${t.desc || ''}</div>
          <div class="arrow">→</div>
        `;
        grid.appendChild(a);
      });
    })
    .catch(() => {
      document.getElementById('grid').innerHTML =
        '<div style="grid-column:1/-1;text-align:center;color:#888">Не могу загрузить плитки</div>';
    });
</script>

</body>
</html>
