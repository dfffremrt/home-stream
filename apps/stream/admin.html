<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 Админка — Home Stream</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0f0f14; color: #eee; min-height: 100vh;
  }
  header {
    padding: 20px 32px; border-bottom: 1px solid #222;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 22px; flex: 1; }
  a { color: #7aa2ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .btn {
    background: #2a2a3a; color: #eee; border: 1px solid #333;
    padding: 10px 18px; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-family: inherit; transition: .15s;
  }
  .btn:hover { background: #35354a; }
  .btn-danger { background: #7a2020; border-color: #a03030; }
  .btn-danger:hover { background: #a03030; }
  .btn-primary { background: #4a7aff; border-color: #5a8aff; color: #fff; font-weight: 600; }
  .btn-primary:hover { background: #5a8aff; }

  /* Экран входа */
  #loginScreen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .login-box {
    background: #1a1a22; border: 1px solid #2a2a3a;
    border-radius: 16px; padding: 40px; max-width: 400px; width: 100%;
    text-align: center;
  }
  .login-box h2 { font-size: 24px; margin-bottom: 8px; }
  .login-box p { color: #888; font-size: 13px; margin-bottom: 28px; }
  .login-box input {
    width: 100%; padding: 14px 18px;
    background: #0a0a0f; border: 1px solid #333;
    color: #fff; border-radius: 10px;
    font-size: 16px; font-family: inherit;
    margin-bottom: 16px; text-align: center;
    letter-spacing: 2px;
  }
  .login-box input:focus { outline: none; border-color: #4a7aff; }
  .login-box button {
    width: 100%; padding: 14px;
    background: #4a7aff; color: #fff; border: none;
    border-radius: 10px; font-size: 16px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .login-box button:hover { background: #5a8aff; }
  .login-error { color: #ff5555; margin-top: 16px; font-size: 13px; }

  /* Панель */
  #panel { display: none; padding: 32px; max-width: 1200px; margin: 0 auto; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px; margin-bottom: 32px;
  }
  .stat {
    background: #1a1a22; border-radius: 12px; padding: 20px;
    border: 1px solid #2a2a3a;
  }
  .stat .label { font-size: 12px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .stat .value { font-size: 28px; font-weight: 700; color: #7aa2ff; }

  .toolbar {
    display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
    align-items: center;
  }
  .toolbar .spacer { flex: 1; }

  table {
    width: 100%; border-collapse: collapse;
    background: #1a1a22; border-radius: 12px; overflow: hidden;
  }
  th, td {
    padding: 14px 18px; text-align: left;
    border-bottom: 1px solid #2a2a3a;
    font-size: 14px;
  }
  th {
    background: #23232e; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1px;
    color: #888; font-weight: 600;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #23232e; }
  td.size { color: #888; font-variant-numeric: tabular-nums; }
  td.actions { text-align: right; white-space: nowrap; }
  td.name a { color: #eee; text-decoration: none; }
  td.name a:hover { color: #7aa2ff; }

  .empty { padding: 60px 20px; text-align: center; color: #666; }
  #toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #1a1a22; padding: 14px 24px; border-radius: 10px;
    border-left: 4px solid #4a7aff; box-shadow: 0 10px 40px rgba(0,0,0,.5);
    z-index: 1000; display: none;
  }
  #toast.error { border-left-color: #ff4444; }
  #toast.show { display: block; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen">
  <div class="login-box">
    <h2>🔐 Админка</h2>
    <p>Введите пароль для управления</p>
    <input type="password" id="password" placeholder="••••••••" autofocus>
    <button onclick="login()">Войти</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ПАНЕЛЬ -->
<div id="panel">
  <header>
    <h1>🔐 Панель управления</h1>
    <a href="/">← На главную</a>
    <button class="btn" onclick="logout()">Выйти</button>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="label">Всего видео</div>
      <div class="value" id="statCount">0</div>
    </div>
    <div class="stat">
      <div class="label">Занято</div>
      <div class="value" id="statSize">0 МБ</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">⬆️ Загрузить видео</button>
    <input type="file" id="fileInput" accept="video/*" multiple style="display:none">
    <button class="btn" onclick="loadList()">🔄 Обновить</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Название</th>
        <th>Размер</th>
        <th style="text-align:right">Действия</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
</div>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);

function fmtSize(bytes) {
  if (!bytes) return '0 Б';
  const units = ['Б', 'КБ', 'МБ', 'ГБ'];
  let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return bytes.toFixed(bytes < 10 ? 1 : 0) + ' ' + units[i];
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

let toastTimer;
function toast(msg, isError) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = isError ? 'error' : '', 3000);
}

async function checkAuth() {
  try {
    const r = await fetch('/api/admin/check', { cache: 'no-store' });
    const d = await r.json();
    if (d.ok) {
      $('loginScreen').style.display = 'none';
      $('panel').style.display = 'block';
      loadList();
    } else {
      $('loginScreen').style.display = 'flex';
      $('panel').style.display = 'none';
    }
  } catch (e) {
    $('loginScreen').style.display = 'flex';
  }
}

async function login() {
  const pw = $('password').value;
  if (!pw) return;
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    const d = await r.json();
    if (d.ok) {
      $('loginError').textContent = '';
      $('password').value = '';
      checkAuth();
    } else {
      $('loginError').textContent = d.error || 'Неверный пароль';
    }
  } catch (e) {
    $('loginError').textContent = 'Ошибка соединения';
  }
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  checkAuth();
}

async function loadList() {
  try {
    const r = await fetch('/api/videos', { cache: 'no-store' });
    const videos = await r.json();
    const list = $('list');
    list.innerHTML = '';

    if (!videos.length) {
      list.innerHTML = '<tr><td colspan="3" class="empty">Пока пусто. Загрузи первое видео.</td></tr>';
      $('statCount').textContent = '0';
      $('statSize').textContent = '0 МБ';
      return;
    }

    let totalSize = 0;
    videos.forEach(v => {
      totalSize += v.size || 0;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="name"><a href="${v.url}" target="_blank">${escHtml(v.title)}</a></td>
        <td class="size">${fmtSize(v.size)}</td>
        <td class="actions">
          <button class="btn btn-danger" onclick="delFile('${escHtml(v.name)}', '${escHtml(v.title)}')">🗑️ Удалить</button>
        </td>
      `;
      list.appendChild(tr);
    });

    $('statCount').textContent = videos.length;
    $('statSize').textContent = fmtSize(totalSize);
  } catch (e) {
    toast('Ошибка загрузки списка', true);
  }
}

async function delFile(name, title) {
  if (!confirm(`Удалить "${title}"?\nЭто действие нельзя отменить.`)) return;
  try {
    const r = await fetch('/api/admin/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: name }),
    });
    const d = await r.json();
    if (d.ok) {
      toast('✅ Удалено: ' + name);
      loadList();
    } else {
      toast('❌ ' + (d.error || 'Ошибка'), true);
    }
  } catch (e) {
    toast('Ошибка соединения', true);
  }
}

$('fileInput').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  if (!files.length) return;

  for (const f of files) {
    await uploadFile(f);
  }
  e.target.value = '';
  loadList();
});

function uploadFile(file) {
  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload');
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) {
        const pct = Math.round(e.loaded / e.total * 100);
        toast(`⏫ ${file.name}: ${pct}%`);
      }
    };
    xhr.onload = () => {
      if (xhr.status === 200) {
        toast(`✅ Загружено: ${file.name}`);
      } else {
        toast(`❌ Ошибка ${xhr.status}: ${file.name}`, true);
      }
      resolve();
    };
    xhr.onerror = () => { toast('Ошибка сети', true); resolve(); };
    const fd = new FormData();
    fd.append('file', file, file.name);
    xhr.send(fd);
  });
}

// Enter в поле пароля
$('password').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') login();
});

// Запуск
checkAuth();
</script>
</body>
</html>
